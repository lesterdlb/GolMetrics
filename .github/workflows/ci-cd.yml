name: CI/CD

on:
  push:
    branches: [finalproject-LDLB]
  pull_request:
    branches: [finalproject-LDLB]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit Tests
        run: dotnet test tests/GolMetrics.API.Tests/ --no-build --filter "Category=Unit"

      - name: Integration Tests
        run: dotnet test tests/GolMetrics.API.Tests/ --no-build --filter "Category=Integration"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Deploy API to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: curl "$deploy_url"

      - name: Deploy Web to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl "$deploy_url"
